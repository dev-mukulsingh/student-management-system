spring.application.name=student-management-system
server.port=8080

# ---- MySQL Database Config ----
# Update the username and password below to match your MySQL setup.
# The database will be created automatically if it does not exist.
spring.datasource.url=jdbc:mysql://localhost:3306/student_management?createDatabaseIfNotExist=true
spring.datasource.username=your_mysql_username
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate Config ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf - disable cache during development so template changes reflect instantly
spring.thymeleaf.cache=false
