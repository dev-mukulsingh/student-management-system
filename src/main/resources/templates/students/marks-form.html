<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Marks Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h1 th:text="${marks.id} != null ? 'Edit Marks' : 'Add Marks'"></h1>
    <p class="subtitle">Student: <span th:text="${student.name}"></span> (<span th:text="${student.rollNumber}"></span>)</p>

    <form th:action="@{/students/{id}/marks/save(id=${student.id})}" th:object="${marks}" method="post" class="form">

        <input type="hidden" th:field="*{id}">

        <label>Subject Name</label>
        <input type="text" th:field="*{subjectName}">
        <p class="error" th:if="${#fields.hasErrors('subjectName')}" th:errors="*{subjectName}"></p>

        <label>Marks Obtained</label>
        <input type="number" step="0.01" th:field="*{marksObtained}">
        <p class="error" th:if="${#fields.hasErrors('marksObtained')}" th:errors="*{marksObtained}"></p>

        <label>Maximum Marks</label>
        <input type="number" step="0.01" th:field="*{maxMarks}">
        <p class="error" th:if="${#fields.hasErrors('maxMarks')}" th:errors="*{maxMarks}"></p>

        <div class="form-actions">
            <button type="submit">Save</button>
            <a th:href="@{/students/{id}(id=${student.id})}" class="btn-secondary">Cancel</a>
        </div>

    </form>

</div>

</body>
</html>
