<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h1>Student Management System</h1>

    <div th:if="${message}" class="alert" th:text="${message}"></div>

    <div class="top-actions">
        <a th:href="@{/students/new}" class="btn">Add New Student</a>
    </div>

    <table class="data-table">
        <thead>
        <tr>
            <th>Roll Number</th>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.rollNumber}"></td>
            <td th:text="${student.name}"></td>
            <td th:text="${student.email}"></td>
            <td th:text="${student.department}"></td>
            <td class="actions">
                <a th:href="@{/students/{id}(id=${student.id})}">View</a>
                <a th:href="@{/students/edit/{id}(id=${student.id})}">Edit</a>
                <a th:href="@{/students/delete/{id}(id=${student.id})}"
                   onclick="return confirm('Delete this student?')">Delete</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(students)}">
            <td colspan="5" class="empty-row">No students added yet.</td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
